<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./tabStyle.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="Aluno.js" defer></script>
    <script src="Turma.js" defer></script>
    <script src="Interface.js" defer></script>
    <script src="main.js" defer></script>
    <title>Sistema Escolar</title>
  </head>
  <body>
    <!-- Botões para trocar de aba -->
    <div class="tabs-container">
      <button class="tab-button active" id="btn-turma" onclick="abrirTurmas()">Turmas</button>
      <button class="tab-button" id="btn-cadastrar" onclick="cadastroAluno()">Cadastrar Aluno</button>
      <button class="tab-button" id="btn-listar" onclick="listarAluno()">Listar Alunos</button>
    </div>

    <!-- Aba 1: Turmas -->
    <div id="tab-turma" class="tab-content active">
      <h3>Cadastrar Turma</h3>
      Professor: <input id="professor" type="text" />
      Curso: <input id="curso" type="text" />
      <button onclick="btnSalvarTurma()" class="btn-salvar">Salvar Turma</button>

      <h3>Turmas Cadastradas</h3>
      <div id="turmas"><p>Nenhuma turma cadastrada ainda.</p></div>
    </div>

    <!-- Aba 2: Cadastrar Aluno -->
    <div id="tab-cadastrar" class="tab-content">
      <p id="aviso-sem-turma" class="aviso">
        Cadastre uma turma na aba "Turmas" antes de cadastrar alunos.
      </p>
      Turma: <select id="sel-turma-cadastrar"></select>
      Nome: <input id="nome" type="text" />
      Nota 1: <input id="n1" type="text" />
      Nota 2: <input id="n2" type="text" />
      Nota 3: <input id="n3" type="text" />
      <button id="btn-salvar-aluno" onclick="btnSalvar()" class="btn-salvar">Salvar Aluno</button>
    </div>

    <!-- Aba 3: Listar Alunos -->
    <div id="tab-listar" class="tab-content">
      <h3>Alunos Cadastrados</h3>
      Turma: <select id="sel-turma-listar" onchange="listarAluno()"></select>
      <div id="alunos">
        <p>Nenhuma turma cadastrada ainda.</p>
      </div>
    </div>
  </body>
</html>
